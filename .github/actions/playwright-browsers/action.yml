name: Playwright browsers
description: Cache and install Chromium for Playwright (requires npm ci first).

inputs:
  working-directory:
    description: Directory containing node_modules after npm ci
    required: false
    default: "."
  install_firefox_webkit:
    description: Install Firefox in addition to Chromium
    required: false
    default: "false"
  install_chrome:
    description: Install Google Chrome channel for Playwright
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: playwright
      name: Playwright version
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-ms-playwright-${{ steps.playwright.outputs.version }}
    - name: Configure apt retries
      run: |
        set -euo pipefail
        echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-p1-retries >/dev/null
      shell: bash
    # The Chrome .deb comes from dl.google.com and is not covered by the ms-playwright cache
    # (PR #34: curl (92) HTTP/2 stream not closed cleanly), so every install retries.
    - name: Install Chromium only
      if: inputs.install_firefox_webkit != 'true'
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if npx playwright install chromium --with-deps; then exit 0; fi
          echo "::warning::playwright install chromium failed (attempt ${attempt}/3)"
          sleep $((attempt * 20))
        done
        exit 1
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Install Chromium and Firefox
      if: inputs.install_firefox_webkit == 'true'
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if npx playwright install chromium firefox --with-deps; then exit 0; fi
          echo "::warning::playwright install chromium firefox failed (attempt ${attempt}/3)"
          sleep $((attempt * 20))
        done
        exit 1
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Install Chrome
      if: inputs.install_chrome == 'true'
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if npx playwright install chrome --with-deps; then exit 0; fi
          echo "::warning::playwright install chrome failed (attempt ${attempt}/3)"
          sleep $((attempt * 20))
        done
        exit 1
      shell: bash
      working-directory: ${{ inputs.working-directory }}
