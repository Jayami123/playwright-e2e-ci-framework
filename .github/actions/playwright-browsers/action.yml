name: Playwright browsers
description: Cache and install Chromium for Playwright (requires npm ci first).

inputs:
  working-directory:
    description: Directory containing node_modules after npm ci
    required: false
    default: "."
  install_firefox_webkit:
    description: Install Firefox and WebKit in addition to Chromium
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: playwright
      name: Playwright version
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-ms-playwright-${{ steps.playwright.outputs.version }}
    - name: Install Chromium only
      if: inputs.install_firefox_webkit != 'true'
      run: |
        set -euo pipefail
        npx playwright install chromium --with-deps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Install Chromium, Firefox, and WebKit
      if: inputs.install_firefox_webkit == 'true'
      run: |
        set -euo pipefail
        npx playwright install chromium firefox webkit --with-deps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
