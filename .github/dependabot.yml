# Dependabot PRs receive no repository secrets, so CI runs the cal-self-hosted E2E path (ADR 0005).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      time: "06:00"
      timezone: Asia/Colombo
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Harness is tag-pinned deliberately; repin via explicit PRs.
      - dependency-name: qa-portfolio-harness
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      time: "06:00"
      timezone: Asia/Colombo
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
