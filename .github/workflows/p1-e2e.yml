name: P1 E2E

on:
  pull_request:
  push:
    branches: [main]
  # No workflow_dispatch inputs: untrusted cal_ref + default-branch cache scope is
  # CodeQL actions/cache-poisoning/poisonable-step (see e2e.yml cal-self-hosted caches).
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      cal_ref: main
    secrets: inherit
