name: P1 E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cal_ref:
        description: Git ref for Jayami123/cal (self-hosted job only)
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      cal_ref: ${{ github.event.inputs.cal_ref || 'main' }}
    secrets: inherit
