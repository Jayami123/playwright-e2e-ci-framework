name: P1 E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      browser_matrix:
        description: Run Chromium and Firefox on self-hosted Cal
        type: boolean
        default: false
      documenso_probe_only:
        description: Documenso harness up, secure-context preflight, and --list only
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      run_browser_matrix: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.browser_matrix) }}
      playwright_browsers_timeout_minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.browser_matrix)) && 20 || 10 }}
      documenso_probe_only: ${{ github.event_name == 'workflow_dispatch' && inputs.documenso_probe_only }}
      documenso_self_hosted_timeout_minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.documenso_probe_only && 30 || 90 }}
    secrets: inherit

  nightly-alert:
    name: nightly-alert
    needs: e2e
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.browser_matrix)) }}
    concurrency: nightly-alert
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        timeout-minutes: 5
        with:
          pattern: playwright-test-results-*
          path: matrix-results
          merge-multiple: false
      - name: Open or update nightly failure issue
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh label create nightly-failure \
            --description "Open while a scheduled or browser_matrix E2E run is red" \
            --color B60205 || true

          find_json() {
            local base="$1"
            find matrix-results -name "$base" -type f 2>/dev/null | head -1 || true
          }

          browser_summary() {
            local file="$1"
            local label="$2"
            local path
            path="$(find_json "$file")"
            if [ -z "$path" ]; then
              path="/tmp/missing-${label}.json"
            fi
            npx tsx scripts/write-ci-job-summary.mts "$path" "$label"
          }

          CHROMIUM_MD="$(browser_summary results-chromium.json chromium)"
          FIREFOX_MD="$(browser_summary results-firefox.json firefox)"
          DOC_CHROMIUM_MD="$(browser_summary results-documenso-chromium.json documenso-chromium)"
          DOC_FIREFOX_MD="$(browser_summary results-documenso-firefox.json documenso-firefox)"
          TWENTY_MD="$(browser_summary results-twenty-chromium.json twenty-chromium)"
          MEDUSA_MD="$(browser_summary results-medusa-chromium.json medusa-chromium)"

          case "$E2E_RESULT" in
            cancelled|skipped)
              echo "E2E job was ${E2E_RESULT}; no issue updates."
              exit 0
              ;;
            failure)
              ;;
            success)
              ;;
            *)
              echo "::error::Unexpected e2e job result: ${E2E_RESULT}"
              exit 1
              ;;
          esac

          OPEN_ISSUE="$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ "$E2E_RESULT" = "success" ]; then
            if [ -z "$OPEN_ISSUE" ]; then
              echo "Nightly E2E passed; no open nightly-failure issue."
              exit 0
            fi
            gh issue comment "$OPEN_ISSUE" --body "Recovered in ${RUN_URL}"
            gh issue close "$OPEN_ISSUE"
            exit 0
          fi

          date_utc="$(date -u +%F)"
          BODY_FILE="$(mktemp)"
          {
            echo "Workflow run: ${RUN_URL}"
            echo ""
            echo "$CHROMIUM_MD"
            echo "$FIREFOX_MD"
            echo "$DOC_CHROMIUM_MD"
            echo "$DOC_FIREFOX_MD"
            echo "$TWENTY_MD"
            echo "$MEDUSA_MD"
          } > "$BODY_FILE"

          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body-file "$BODY_FILE"
          else
            gh issue create \
              --title "Nightly E2E failed: ${date_utc}" \
              --label nightly-failure \
              --body-file "$BODY_FILE"
          fi

  # Prerequisite (repo admin, once): Settings -> Pages -> Build and deployment -> Source "GitHub Actions".
  # Without it deploy-pages fails with "Pages site not found" on every push to main.
  pages-build:
    name: pages-build
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: all-blobs
          merge-multiple: true
      - name: Merge, scrub and scan the report
        run: |
          set -euo pipefail
          mkdir -p test-results
          npx playwright merge-reports --config playwright.merge.config.ts ./all-blobs
          npx tsx scripts/prepare-pages-report.mts playwright-report
          npx tsx scripts/scan-report-secrets.mts playwright-report test-results/results.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report

  pages-deploy:
    name: pages-deploy
    needs: pages-build
    if: ${{ !cancelled() && needs.pages-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
