name: E2E

# Called from p1-e2e.yml. Job-level `if: secrets.*` is always empty in Actions,
# so live vs self-hosted is decided from an env check after the secret is injected.
on:
  workflow_call:
    inputs:
      cal_ref:
        description: Git ref for Jayami123/cal checkout
        type: string
        default: main
    secrets:
      CAL_E2E_BASE_URL:
        required: false
      CAL_E2E_EMAIL:
        required: false
      CAL_E2E_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CAL_REF: ${{ inputs.cal_ref }}
  CAL_E2E_LOCAL_BASE_URL: http://127.0.0.1:3000
  CAL_SELF_HOSTED_TIMEOUT_MINUTES: "90"
  CAL_DEFAULT_E2E_EMAIL: pro@example.com
  CAL_DEFAULT_E2E_PASSWORD: pro
  PRODUCTS_ROOT: ${{ github.workspace }}
  CAL_PRODUCT_DIR: ${{ github.workspace }}/cal

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  structural:
    name: typecheck (always)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_live_url: ${{ steps.live.outputs.has_live_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - id: live
        env:
          CAL_E2E_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
        run: |
          if [ -n "$CAL_E2E_BASE_URL" ]; then
            echo "has_live_url=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_live_url=false" >> "$GITHUB_OUTPUT"
          fi

  cal-chromium:
    name: cal-chromium shard ${{ matrix.shard }}
    needs: [lint, structural]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: needs.structural.outputs.has_live_url == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CAL_E2E_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
      CAL_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
      CAL_E2E_EMAIL: ${{ secrets.CAL_E2E_EMAIL }}
      CAL_E2E_PASSWORD: ${{ secrets.CAL_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium --with-deps
      - name: Run Cal Chromium shard
        run: npx playwright test --project=cal-chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3

  merge-reports:
    name: merge Playwright HTML report
    needs: [structural, cal-chromium]
    if: ${{ !cancelled() && needs.structural.outputs.has_live_url == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge blob reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  cal-self-hosted:
    name: cal-self-hosted
    needs: [lint, structural]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(env.CAL_SELF_HOSTED_TIMEOUT_MINUTES) }}
    if: needs.structural.outputs.has_live_url != 'true'
    env:
      CAL_E2E_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
      CAL_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
      PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
      CAL_PRODUCT_DIR: ${{ env.CAL_PRODUCT_DIR }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout Cal fork
        id: checkout_cal
        uses: actions/checkout@v5
        with:
          repository: Jayami123/cal
          ref: ${{ env.CAL_REF }}
          path: cal
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v4
        id: cal_yarn_cache
        with:
          path: cal/.yarn/cache
          key: cal-yarn-${{ hashFiles('cal/yarn.lock') }}

      - uses: actions/cache@v4
        id: cal_next_cache
        with:
          path: cal/apps/web/.next
          key: cal-next-${{ steps.checkout_cal.outputs.commit }}

      - name: Install Cal dependencies
        working-directory: cal
        run: |
          corepack enable
          yarn install --immutable

      - name: Prepare Cal product .env
        run: |
          cp cal/.env.example cal/.env
          sed -i \
            -e 's|http://localhost:3000|http://127.0.0.1:3000|g' \
            -e "s|^NEXTAUTH_SECRET=$|NEXTAUTH_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^CALENDSO_ENCRYPTION_KEY=$|CALENDSO_ENCRYPTION_KEY=$(openssl rand -base64 24)|" \
            cal/.env

      - name: Set Cal E2E credentials
        env:
          SECRET_EMAIL: ${{ secrets.CAL_E2E_EMAIL }}
          SECRET_PASSWORD: ${{ secrets.CAL_E2E_PASSWORD }}
        run: |
          if [ -n "$SECRET_EMAIL" ]; then
            echo "CAL_E2E_EMAIL=$SECRET_EMAIL" >> "$GITHUB_ENV"
          else
            echo "CAL_E2E_EMAIL=${{ env.CAL_DEFAULT_E2E_EMAIL }}" >> "$GITHUB_ENV"
          fi
          if [ -n "$SECRET_PASSWORD" ]; then
            echo "CAL_E2E_PASSWORD=$SECRET_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "CAL_E2E_PASSWORD=${{ env.CAL_DEFAULT_E2E_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright.outputs.version }}

      - run: npx playwright install chromium --with-deps

      - name: Run Cal E2E suite
        run: npm run test:cal

      - name: Merge blob reports into HTML
        if: ${{ !cancelled() }}
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Redact Cal server log
        if: ${{ always() }}
        run: |
          LOG_SRC="node_modules/qa-portfolio-harness/.harness/cal-web.log"
          LOG_DST="cal-web-redacted.log"
          if [ -f "$LOG_SRC" ]; then
            sed -E \
              -e '/(SECRET|PASSWORD|KEY|TOKEN|API_KEY|ENCRYPTION)=/Id' \
              -e '/Bearer /Id' \
              "$LOG_SRC" > "$LOG_DST"
          else
            echo "(no cal-web.log from harness)" > "$LOG_DST"
          fi

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: ${{ always() }}
        with:
          name: cal-server-log
          path: cal-web-redacted.log
          retention-days: 14

      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: cal/apps/web/.next
          key: cal-next-${{ steps.checkout_cal.outputs.commit }}
