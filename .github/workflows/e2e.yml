name: E2E

# Called from p1-e2e.yml. Job-level `if: secrets.*` is always empty in Actions,
# so live vs self-hosted is decided from an env check after the secret is injected.
on:
  workflow_call:
    inputs:
      self_hosted_timeout_minutes:
        description: Timeout for the cal-self-hosted job
        type: number
        default: 90
      playwright_browsers_timeout_minutes:
        description: >
          Timeout for Playwright Chromium install steps (cache + apt --with-deps).
          Hung apt mirrors (run 37792386085 attempt 1) must fail fast instead of
          consuming the 90-minute cal-self-hosted job.
        type: number
        default: 10
      run_browser_matrix:
        description: Run Chromium then Firefox matrix suites on self-hosted Cal
        type: boolean
        default: false
      documenso_self_hosted_timeout_minutes:
        description: Timeout for the documenso-self-hosted job
        type: number
        default: 90
      documenso_probe_only:
        description: Start Documenso via harness, secure-context preflight, and --list only
        type: boolean
        default: false
      twenty_chromium_timeout_minutes:
        description: Timeout for the twenty-chromium job
        type: number
        default: 60
    secrets:
      CAL_E2E_BASE_URL:
        required: false
      CAL_E2E_EMAIL:
        required: false
      CAL_E2E_PASSWORD:
        required: false
      CAL_DST_EMAIL:
        required: false
      CAL_DST_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CAL_REF: main
  DOCUMENSO_REF: f4105e47eba56f5d8d7e70dd516a8fcc0c870d7c
  DOCUMENSO_E2E_LISTEN_URL: http://127.0.0.1:3001
  DOCUMENSO_E2E_PUBLIC_URL: http://p1.lvh.me:3001
  DOCUMENSO_E2E_DB_URL: postgres://documenso:password@127.0.0.1:5451/documenso
  TWENTY_REF: 7cbdfec6f346b43715bc2056932f4fad5886f733
  TWENTY_IMAGE_TAG: v2.44.0
  TWENTY_E2E_BASE_URL: http://127.0.0.1:3002
  TWENTY_E2E_DB_URL: postgres://postgres:postgres@127.0.0.1:5434/default
  CAL_E2E_LOCAL_BASE_URL: http://127.0.0.1:3000
  CAL_DEFAULT_E2E_EMAIL: pro@example.com
  CAL_DEFAULT_DST_EMAIL: trial@example.com
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_INSTALLER_SHA: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

jobs:
  changes:
    name: path filters
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cal: ${{ steps.paths.outputs.cal }}
      documenso: ${{ steps.paths.outputs.documenso }}
      twenty: ${{ steps.paths.outputs.twenty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        run: |
          set -euo pipefail
          cal=false
          documenso=false
          twenty=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            cal=true
            documenso=true
            twenty=true
          else
            mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            cal_re='^(tests/cal/|tests/setup/cal\.setup\.ts|src/products/cal/|global-setup/index\.ts|src/core/|playwright\.config\.ts|package\.json|package-lock\.json|\.github/workflows/|\.github/actions/)'
            doc_re='^(tests/documenso/|src/products/documenso/|global-setup/documenso\.ts|scripts/count-documenso-qa-leaks\.mts|scripts/assert-documenso-secure-context\.mts|global-setup/index\.ts|src/core/|playwright\.config\.ts|package\.json|package-lock\.json|\.github/workflows/|\.github/actions/)'
            tw_re='^(tests/twenty/|tests/setup/twenty\.setup\.ts|src/products/twenty/|global-setup/twenty\.ts|global-teardown/twenty\.ts|scripts/count-twenty-qa-leaks\.mts|global-setup/index\.ts|src/core/|playwright\.config\.ts|package\.json|package-lock\.json|\.github/workflows/|\.github/actions/)'
            for file in "${changed[@]}"; do
              if [[ "$file" =~ $cal_re ]]; then cal=true; fi
              if [[ "$file" =~ $doc_re ]]; then documenso=true; fi
              if [[ "$file" =~ $tw_re ]]; then twenty=true; fi
            done
          fi
          echo "cal=$cal" >> "$GITHUB_OUTPUT"
          echo "documenso=$documenso" >> "$GITHUB_OUTPUT"
          echo "twenty=$twenty" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_INSTALLER_SHA}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          version_out="$(./actionlint -version)"
          echo "$version_out"
          case "$version_out" in
            *1.7.12*) ;;
            *) echo "::error::Expected actionlint 1.7.12, got: ${version_out}"; exit 1 ;;
          esac
      - name: Lint workflows
        run: |
          set -euo pipefail
          ./actionlint
      - uses: ./.github/actions/setup-p1
      - name: npm audit
        run: |
          set -euo pipefail
          npm audit --audit-level=high
      - run: |
          set -euo pipefail
          npm run lint
      - run: |
          set -euo pipefail
          npm run format:check
      - run: |
          set -euo pipefail
          npm run test:unit

  structural:
    name: typecheck (always)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_live_url: ${{ steps.live.outputs.has_live_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - run: |
          set -euo pipefail
          npm run typecheck
      - id: live
        env:
          CAL_E2E_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "$CAL_E2E_BASE_URL" ]; then
            echo "has_live_url=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_live_url=false" >> "$GITHUB_OUTPUT"
          fi

  cal-chromium:
    name: cal-chromium shard ${{ matrix.shard }} (live Cal only, skipped without CAL_E2E_BASE_URL)
    needs: [structural]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: needs.structural.outputs.has_live_url == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CAL_E2E_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
      CAL_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
      CAL_E2E_EMAIL: ${{ secrets.CAL_E2E_EMAIL }}
      CAL_E2E_PASSWORD: ${{ secrets.CAL_E2E_PASSWORD }}
      CAL_DST_EMAIL: ${{ secrets.CAL_DST_EMAIL }}
      CAL_DST_PASSWORD: ${{ secrets.CAL_DST_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - uses: ./.github/actions/playwright-browsers
        timeout-minutes: ${{ inputs.playwright_browsers_timeout_minutes }}
      - name: Run Cal Chromium shard
        run: |
          set -euo pipefail
          npx playwright test --project=cal-chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3

  merge-reports:
    name: merge Playwright HTML report (live Cal only, skipped without CAL_E2E_BASE_URL)
    needs: [structural, cal-chromium]
    if: ${{ !cancelled() && needs.structural.outputs.has_live_url == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge blob reports into HTML
        run: |
          set -euo pipefail
          mkdir -p test-results
          npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports
      - name: Write Playwright job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  cal-self-hosted:
    name: cal-self-hosted
    needs: [structural, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.self_hosted_timeout_minutes }}
    if: >-
      needs.structural.outputs.has_live_url != 'true'
      && needs.changes.outputs.cal == 'true'
    env:
      P1_WORKING_DIRECTORY: p1
      CAL_CHECKOUT_PATH: products/cal
      PRODUCTS_ROOT: ${{ github.workspace }}/products
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Checkout Cal fork
        id: checkout_cal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/cal
          ref: ${{ env.CAL_REF }}
          path: ${{ env.CAL_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Stub harness product roots
        run: |
          set -euo pipefail
          # qa-portfolio-harness loadConfig() resolves every product under PRODUCTS_ROOT.
          mkdir -p "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/medusa" "${PRODUCTS_ROOT}/twenty-CRM"

      - uses: ./p1/.github/actions/setup-p1
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Restore Cal Yarn cache
        id: cal_yarn
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Restore Cal Next.js build cache
        id: cal_next
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ steps.checkout_cal.outputs.commit }}

      - name: Restore Cal node_modules cache
        id: cal_nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CAL_CHECKOUT_PATH }}/node_modules
            ${{ env.CAL_CHECKOUT_PATH }}/node_modules/.prisma
          key: ${{ runner.os }}-cal-nm-${{ steps.checkout_cal.outputs.commit }}-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Install Cal dependencies
        if: steps.cal_nm.outputs.cache-hit != 'true'
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Generate Cal Prisma client
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          corepack enable
          yarn workspace @calcom/prisma prisma generate

      - name: Save Cal Yarn cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.cal_yarn.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Save Cal node_modules cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.cal_nm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CAL_CHECKOUT_PATH }}/node_modules
            ${{ env.CAL_CHECKOUT_PATH }}/node_modules/.prisma
          key: ${{ runner.os }}-cal-nm-${{ steps.checkout_cal.outputs.commit }}-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Prepare Cal product .env
        env:
          CAL_ENV_DIR: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          cp "${CAL_ENV_DIR}/.env.example" "${CAL_ENV_DIR}/.env"
          sed -i 's|http://localhost:3000|http://127.0.0.1:3000|g' "${CAL_ENV_DIR}/.env"
          NEXTAUTH_SECRET="$(openssl rand -base64 32)"
          CALENDSO_ENCRYPTION_KEY="$(openssl rand -base64 24)"
          echo "::add-mask::${NEXTAUTH_SECRET}"
          echo "::add-mask::${CALENDSO_ENCRYPTION_KEY}"
          grep -v '^NEXTAUTH_SECRET=' "${CAL_ENV_DIR}/.env" | grep -v '^CALENDSO_ENCRYPTION_KEY=' > "${CAL_ENV_DIR}/.env.tmp"
          mv "${CAL_ENV_DIR}/.env.tmp" "${CAL_ENV_DIR}/.env"
          printf 'NEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET" >> "${CAL_ENV_DIR}/.env"
          printf 'CALENDSO_ENCRYPTION_KEY=%s\n' "$CALENDSO_ENCRYPTION_KEY" >> "${CAL_ENV_DIR}/.env"
          if ! grep -qE '^NEXTAUTH_SECRET=.+' "${CAL_ENV_DIR}/.env"; then
            echo "::error::NEXTAUTH_SECRET is empty in ${CAL_ENV_DIR}/.env after prepare"
            exit 1
          fi
          if ! grep -qE '^CALENDSO_ENCRYPTION_KEY=.+' "${CAL_ENV_DIR}/.env"; then
            echo "::error::CALENDSO_ENCRYPTION_KEY is empty in ${CAL_ENV_DIR}/.env after prepare"
            exit 1
          fi

      - uses: ./p1/.github/actions/playwright-browsers
        timeout-minutes: ${{ inputs.playwright_browsers_timeout_minutes }}
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}
          install_firefox_webkit: ${{ inputs.run_browser_matrix }}

      - name: Run Cal E2E suite
        if: ${{ !inputs.run_browser_matrix }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          CAL_E2E_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_E2E_EMAIL: ${{ env.CAL_DEFAULT_E2E_EMAIL }}
          CAL_E2E_PASSWORD: pro
          CAL_DST_EMAIL: ${{ env.CAL_DEFAULT_DST_EMAIL }}
          CAL_DST_PASSWORD: trial
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
        run: |
          set -euo pipefail
          # Harness up() owns Postgres, seed, tRPC types, and next build.
          npm run test:cal

      - name: Run Cal E2E suite (matrix Chromium)
        if: ${{ inputs.run_browser_matrix }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          CAL_E2E_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_E2E_EMAIL: ${{ env.CAL_DEFAULT_E2E_EMAIL }}
          CAL_E2E_PASSWORD: pro
          CAL_DST_EMAIL: ${{ env.CAL_DEFAULT_DST_EMAIL }}
          CAL_DST_PASSWORD: trial
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          P1_PW_REPORT_ID: chromium
        run: |
          set -euo pipefail
          SECONDS=0
          npm run test:cal
          echo "P1_MATRIX_CHROMIUM_ELAPSED=$SECONDS" >> "$GITHUB_ENV"

      - name: Write Playwright job summary (matrix Chromium)
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_MATRIX_CHROMIUM_ELAPSED: ${{ env.P1_MATRIX_CHROMIUM_ELAPSED }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results-chromium.json chromium "${P1_MATRIX_CHROMIUM_ELAPSED:-}"

      - name: Merge blob reports (matrix Chromium)
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report-chromium ] && [ -n "$(find blob-report-chromium -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report-chromium
            rm -rf playwright-report-chromium
            mv playwright-report playwright-report-chromium
          else
            echo "No blob report to merge for chromium."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        with:
          name: playwright-report-chromium
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report-chromium
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        with:
          name: playwright-test-results-chromium
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Cal E2E suite (matrix Firefox)
        if: ${{ inputs.run_browser_matrix }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          CAL_E2E_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_E2E_EMAIL: ${{ env.CAL_DEFAULT_E2E_EMAIL }}
          CAL_E2E_PASSWORD: pro
          CAL_DST_EMAIL: ${{ env.CAL_DEFAULT_DST_EMAIL }}
          CAL_DST_PASSWORD: trial
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          P1_PW_REPORT_ID: firefox
        run: |
          set -euo pipefail
          SECONDS=0
          npm run test:cal:firefox
          echo "P1_MATRIX_FIREFOX_ELAPSED=$SECONDS" >> "$GITHUB_ENV"

      - name: Write Playwright job summary (matrix Firefox)
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_MATRIX_FIREFOX_ELAPSED: ${{ env.P1_MATRIX_FIREFOX_ELAPSED }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results-firefox.json firefox "${P1_MATRIX_FIREFOX_ELAPSED:-}"

      - name: Merge blob reports (matrix Firefox)
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report-firefox ] && [ -n "$(find blob-report-firefox -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report-firefox
            rm -rf playwright-report-firefox
            mv playwright-report playwright-report-firefox
          else
            echo "No blob report to merge for firefox."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        with:
          name: playwright-report-firefox
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report-firefox
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.run_browser_matrix && !cancelled() }}
        with:
          name: playwright-test-results-firefox
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Write Playwright job summary
        if: ${{ !inputs.run_browser_matrix && !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results.json

      - name: Merge blob reports into HTML
        if: ${{ !inputs.run_browser_matrix && !cancelled() }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report ] && [ -n "$(find blob-report -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report
          else
            echo "No blob report to merge (tests may have failed before reporters ran)."
          fi

      - name: Redact Cal server log
        if: ${{ always() }}
        env:
          CAL_ENV_DIR: ${{ env.CAL_CHECKOUT_PATH }}
          P1_DIR: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          LOG_SRC="${P1_DIR}/node_modules/qa-portfolio-harness/.harness/cal-web.log"
          LOG_DST="cal-web-redacted.log"
          if [ ! -f "$LOG_SRC" ]; then
            echo "(no cal-web.log from harness)" > "$LOG_DST"
            exit 0
          fi
          sed -E \
            -e '/(SECRET|PASSWORD|KEY|TOKEN|API_KEY|ENCRYPTION)=/Id' \
            -e '/Bearer /Id' \
            "$LOG_SRC" > "$LOG_DST"
          read_env() {
            local key="$1"
            grep -E "^${key}=" "${CAL_ENV_DIR}/.env" | sed -E "s/^${key}=//" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }
          NEXTAUTH_VAL="$(read_env NEXTAUTH_SECRET)"
          ENCRYPTION_VAL="$(read_env CALENDSO_ENCRYPTION_KEY)"
          DB_URL="$(read_env DATABASE_URL)"
          DB_PASS=""
          if [[ "$DB_URL" =~ postgresql://[^:/@]+:([^@]*)@ ]]; then
            DB_PASS="${BASH_REMATCH[1]}"
          fi
          export NEXTAUTH_VAL ENCRYPTION_VAL DB_PASS
          perl -i -pe '
            my ($n, $e, $p) = ($ENV{NEXTAUTH_VAL}, $ENV{ENCRYPTION_VAL}, $ENV{DB_PASS});
            s/\Q$n\E/[REDACTED]/g if length $n;
            s/\Q$e\E/[REDACTED]/g if length $e;
            s/\Q$p\E/[REDACTED]/g if length $p;
          ' "$LOG_DST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.run_browser_matrix && !cancelled() }}
        with:
          name: playwright-report
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.run_browser_matrix && !cancelled() }}
        with:
          name: playwright-test-results
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: cal-server-log
          path: cal-web-redacted.log
          retention-days: 14

      - name: Save Cal Next.js build cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.cal_next.outputs.cache-hit != 'true'
          && hashFiles(format('{0}/apps/web/.next/required-server-files.json', env.CAL_CHECKOUT_PATH)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ steps.checkout_cal.outputs.commit }}

  documenso-self-hosted:
    name: documenso-self-hosted
    needs: [structural, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.documenso_self_hosted_timeout_minutes }}
    if: needs.changes.outputs.documenso == 'true'
    env:
      P1_WORKING_DIRECTORY: p1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Set Documenso paths outside workspace
        run: |
          set -euo pipefail
          # Vite rollup external /playwright/ matches .../playwright-e2e-ci-framework/ entry paths.
          echo "PRODUCTS_ROOT=${RUNNER_TEMP}/products" >> "$GITHUB_ENV"
          echo "DOCUMENSO_CHECKOUT_PATH=${RUNNER_TEMP}/products/documenso" >> "$GITHUB_ENV"

      - name: Clone Documenso fork outside workspace
        id: checkout_documenso
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${DOCUMENSO_CHECKOUT_PATH}")"
          if [ -d "${DOCUMENSO_CHECKOUT_PATH}/.git" ]; then
            rm -rf "${DOCUMENSO_CHECKOUT_PATH}"
          fi
          git clone https://github.com/Jayami123/documenso.git "${DOCUMENSO_CHECKOUT_PATH}"
          git -C "${DOCUMENSO_CHECKOUT_PATH}" checkout "${DOCUMENSO_REF}"
          head="$(git -C "${DOCUMENSO_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${DOCUMENSO_REF}" ]; then
            echo "::error::Documenso HEAD ${head} does not match DOCUMENSO_REF ${DOCUMENSO_REF}"
            exit 1
          fi
          echo "commit=${head}" >> "$GITHUB_OUTPUT"

      - id: documenso_lockfile
        name: Hash Documenso package-lock.json
        run: |
          set -euo pipefail
          sum="$(sha256sum "${DOCUMENSO_CHECKOUT_PATH}/package-lock.json" | awk '{print $1}')"
          echo "hash=${sum}" >> "$GITHUB_OUTPUT"

      - name: Stub harness product roots
        run: |
          set -euo pipefail
          mkdir -p "${PRODUCTS_ROOT}/cal" "${PRODUCTS_ROOT}/medusa" "${PRODUCTS_ROOT}/twenty-CRM"

      - name: Map Documenso public host to loopback
        run: |
          set -euo pipefail
          echo "127.0.0.1 p1.lvh.me" | sudo tee -a /etc/hosts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Record Node 24 binary
        run: echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"

      - name: Restore Documenso node_modules cache
        id: documenso_nm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DOCUMENSO_CHECKOUT_PATH }}/node_modules
            ${{ env.DOCUMENSO_CHECKOUT_PATH }}/node_modules/.prisma
            ${{ env.DOCUMENSO_CHECKOUT_PATH }}/packages/prisma/node_modules
          key: ${{ runner.os }}-documenso-nm-${{ steps.checkout_documenso.outputs.commit }}-${{ steps.documenso_lockfile.outputs.hash }}

      - name: Restore Documenso Remix build cache
        id: documenso_remix
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}/apps/remix/build
          key: ${{ runner.os }}-documenso-remix-${{ steps.checkout_documenso.outputs.commit }}

      - name: Install Documenso product dependencies
        if: steps.documenso_nm.outputs.cache-hit != 'true'
        working-directory: ${{ env.DOCUMENSO_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          npm ci

      - name: Save Documenso node_modules cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.documenso_nm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DOCUMENSO_CHECKOUT_PATH }}/node_modules
            ${{ env.DOCUMENSO_CHECKOUT_PATH }}/node_modules/.prisma
            ${{ env.DOCUMENSO_CHECKOUT_PATH }}/packages/prisma/node_modules
          key: ${{ runner.os }}-documenso-nm-${{ steps.checkout_documenso.outputs.commit }}-${{ steps.documenso_lockfile.outputs.hash }}

      - uses: ./p1/.github/actions/setup-p1
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}

      - uses: ./p1/.github/actions/playwright-browsers
        timeout-minutes: ${{ inputs.playwright_browsers_timeout_minutes }}
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}
          install_chrome: "true"
          install_firefox_webkit: ${{ inputs.run_browser_matrix }}

      - name: Start Documenso (limits enforced)
        id: documenso_up
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
        run: |
          set -euo pipefail
          "${NODE24}" node_modules/qa-portfolio-harness/scripts/up.mjs documenso

      - name: Run P1-DOC-RL-001
        if: ${{ !inputs.documenso_probe_only && steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_PLAYWRIGHT_HARNESS: "0"
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
        run: |
          set -euo pipefail
          npm run test:documenso:rate-limit

      - name: Stop Documenso (harness down)
        if: ${{ !inputs.documenso_probe_only && steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
        run: |
          set -euo pipefail
          "${NODE24}" node_modules/qa-portfolio-harness/scripts/down.mjs documenso

      - name: Start Documenso (rate-limit bypass)
        id: documenso_up_bypass
        if: ${{ !inputs.documenso_probe_only && steps.documenso_up.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
          DANGEROUS_BYPASS_RATE_LIMITS: "true"
        run: |
          set -euo pipefail
          "${NODE24}" node_modules/qa-portfolio-harness/scripts/up.mjs documenso

      - name: Documenso secure-context preflight
        if: >-
          ${{ (inputs.documenso_probe_only && steps.documenso_up.outcome == 'success')
          || steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
        run: |
          set -euo pipefail
          npx tsx scripts/assert-documenso-secure-context.mts

      - name: List Documenso Chromium tests
        if: >-
          ${{ (inputs.documenso_probe_only && steps.documenso_up.outcome == 'success')
          || steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
        run: |
          set -euo pipefail
          npx playwright test --project=documenso-chromium --list

      - name: Run Documenso E2E suite
        if: >-
          ${{ !inputs.documenso_probe_only && !inputs.run_browser_matrix
          && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_PLAYWRIGHT_HARNESS: "0"
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          P1_DOCUMENSO_RETRIES: 0
        run: |
          set -euo pipefail
          npm run test:documenso

      - name: Run Documenso E2E suite (matrix Chromium)
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_PLAYWRIGHT_HARNESS: "0"
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          P1_DOCUMENSO_RETRIES: 0
          P1_PW_REPORT_ID: documenso-chromium
        run: |
          set -euo pipefail
          SECONDS=0
          npm run test:documenso
          echo "P1_MATRIX_DOCUMENSO_CHROMIUM_ELAPSED=$SECONDS" >> "$GITHUB_ENV"

      - name: Write Playwright job summary (matrix Documenso Chromium)
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_MATRIX_DOCUMENSO_CHROMIUM_ELAPSED: ${{ env.P1_MATRIX_DOCUMENSO_CHROMIUM_ELAPSED }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results-documenso-chromium.json documenso-chromium "${P1_MATRIX_DOCUMENSO_CHROMIUM_ELAPSED:-}"

      - name: Merge blob reports (matrix Documenso Chromium)
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report-documenso-chromium ] && [ -n "$(find blob-report-documenso-chromium -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report-documenso-chromium
            rm -rf playwright-report-documenso-chromium
            mv playwright-report playwright-report-documenso-chromium
          else
            echo "No blob report to merge for documenso-chromium."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        with:
          name: playwright-report-documenso-chromium
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report-documenso-chromium
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.documenso_up_bypass.outcome == 'success' && inputs.run_browser_matrix }}
        with:
          name: playwright-test-results-documenso-chromium
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Documenso E2E suite (matrix Firefox)
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          DOCUMENSO_BASE_URL: ${{ env.DOCUMENSO_E2E_LISTEN_URL }}
          DOCUMENSO_PUBLIC_URL: ${{ env.DOCUMENSO_E2E_PUBLIC_URL }}
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          P1_DOCUMENSO_RETRIES: 0
          P1_PW_REPORT_ID: documenso-firefox
        run: |
          set -euo pipefail
          SECONDS=0
          npm run test:documenso:firefox
          echo "P1_MATRIX_DOCUMENSO_FIREFOX_ELAPSED=$SECONDS" >> "$GITHUB_ENV"

      - name: Write Playwright job summary (matrix Documenso Firefox)
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          P1_MATRIX_DOCUMENSO_FIREFOX_ELAPSED: ${{ env.P1_MATRIX_DOCUMENSO_FIREFOX_ELAPSED }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results-documenso-firefox.json documenso-firefox "${P1_MATRIX_DOCUMENSO_FIREFOX_ELAPSED:-}"

      - name: Merge blob reports (matrix Documenso Firefox)
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report-documenso-firefox ] && [ -n "$(find blob-report-documenso-firefox -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report-documenso-firefox
            rm -rf playwright-report-documenso-firefox
            mv playwright-report playwright-report-documenso-firefox
          else
            echo "No blob report to merge for documenso-firefox."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          ${{ !inputs.documenso_probe_only && inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        with:
          name: playwright-report-documenso-firefox
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report-documenso-firefox
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.documenso_up_bypass.outcome == 'success' && inputs.run_browser_matrix }}
        with:
          name: playwright-test-results-documenso-firefox
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Write Playwright job summary
        if: >-
          ${{ !inputs.documenso_probe_only && !inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results.json

      - name: Merge blob reports into HTML
        if: >-
          ${{ !inputs.documenso_probe_only && !inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report ] && [ -n "$(find blob-report -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report
          else
            echo "No blob report to merge (tests may have failed before reporters ran)."
          fi

      - name: Count Documenso QA leaks
        if: >-
          ${{ always() && !cancelled() && !inputs.documenso_probe_only
          && steps.documenso_up_bypass.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          DOCUMENSO_DB_URL: ${{ env.DOCUMENSO_E2E_DB_URL }}
        run: |
          set -euo pipefail
          npx tsx scripts/count-documenso-qa-leaks.mts

      - name: Redact Documenso server log
        if: ${{ always() }}
        env:
          P1_DIR: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          LOG_SRC="${P1_DIR}/node_modules/qa-portfolio-harness/.harness/documenso-web.log"
          LOG_DST="documenso-web-redacted.log"
          if [ ! -f "$LOG_SRC" ]; then
            echo "(no documenso-web.log from harness)" > "$LOG_DST"
            exit 0
          fi
          sed -E \
            -e '/(SECRET|PASSWORD|KEY|TOKEN|API_KEY|ENCRYPTION)=/Id' \
            -e '/Bearer /Id' \
            "$LOG_SRC" > "$LOG_DST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          ${{ !inputs.documenso_probe_only && !inputs.run_browser_matrix
          && !cancelled() && steps.documenso_up_bypass.outcome == 'success' }}
        with:
          name: playwright-report-documenso
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.documenso_up_bypass.outcome == 'success' && !inputs.run_browser_matrix }}
        with:
          name: playwright-test-results-documenso-chromium
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: documenso-server-log
          path: documenso-web-redacted.log
          retention-days: 14

      - name: Save Documenso Remix build cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.documenso_remix.outputs.cache-hit != 'true'
          && hashFiles(format('{0}/apps/remix/build/server/main.js', env.DOCUMENSO_CHECKOUT_PATH)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOCUMENSO_CHECKOUT_PATH }}/apps/remix/build
          key: ${{ runner.os }}-documenso-remix-${{ steps.checkout_documenso.outputs.commit }}

  twenty-chromium:
    name: twenty-chromium
    needs: [structural, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.twenty_chromium_timeout_minutes }}
    if: needs.changes.outputs.twenty == 'true'
    env:
      P1_WORKING_DIRECTORY: p1
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      TWENTY_CHECKOUT_PATH: products/twenty-CRM
      TWENTY_IMAGES_TAR: twenty-images.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Checkout Twenty fork
        id: checkout_twenty
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/twenty-CRM
          ref: ${{ env.TWENTY_REF }}
          path: ${{ env.TWENTY_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Verify Twenty fork HEAD
        run: |
          set -euo pipefail
          head="$(git -C "${TWENTY_CHECKOUT_PATH}" rev-parse HEAD)"
          if [ "$head" != "${TWENTY_REF}" ]; then
            echo "::error::Twenty HEAD ${head} does not match TWENTY_REF ${TWENTY_REF}"
            exit 1
          fi

      - name: Stub harness product roots
        run: |
          set -euo pipefail
          mkdir -p "${PRODUCTS_ROOT}/cal" "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/medusa"

      - name: Restore Twenty docker image cache
        id: twenty_images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TWENTY_IMAGES_TAR }}
          key: ${{ runner.os }}-twenty-images-v2.44.0

      - name: Load Twenty docker images
        if: steps.twenty_images.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          gunzip -c "${TWENTY_IMAGES_TAR}" | docker load

      - name: Pull Twenty docker images
        if: steps.twenty_images.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker pull "twentycrm/twenty:${TWENTY_IMAGE_TAG}"
          docker pull postgres:16
          docker pull redis
          docker pull axllent/mailpit:v1.22.3

      - uses: ./p1/.github/actions/setup-p1
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}

      - uses: ./p1/.github/actions/playwright-browsers
        timeout-minutes: ${{ inputs.playwright_browsers_timeout_minutes }}
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Start Twenty (harness up)
        id: twenty_up
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          TWENTY_BASE_URL: ${{ env.TWENTY_E2E_BASE_URL }}
          TWENTY_DB_URL: ${{ env.TWENTY_E2E_DB_URL }}
          TWENTY_IMAGE_TAG: ${{ env.TWENTY_IMAGE_TAG }}
        run: |
          set -euo pipefail
          UP_START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SECONDS=0
          node node_modules/qa-portfolio-harness/scripts/up.mjs twenty
          UP_SECONDS=$SECONDS
          UP_END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "### Twenty harness up"
            echo ""
            echo "- start: ${UP_START}"
            echo "- end: ${UP_END}"
            echo "- seconds: ${UP_SECONDS}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TWENTY_UP_START=${UP_START}" >> "$GITHUB_ENV"
          echo "TWENTY_UP_END=${UP_END}" >> "$GITHUB_ENV"
          echo "TWENTY_UP_SECONDS=${UP_SECONDS}" >> "$GITHUB_ENV"

      - name: Record Twenty Redis image digest
        if: steps.twenty_up.outcome == 'success'
        run: |
          set -euo pipefail
          digest="$(docker inspect qa-harness-twenty-redis-1 --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          if [ -z "$digest" ]; then
            digest="redis digest: unavailable"
          fi
          {
            echo "### Twenty Redis image"
            echo ""
            echo "- digest: ${digest}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Twenty E2E suite
        if: >-
          ${{ steps.twenty_up.outcome == 'success'
          && github.event_name != 'schedule' && !inputs.run_browser_matrix }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PW_WORKERS: "2"
          TWENTY_BASE_URL: ${{ env.TWENTY_E2E_BASE_URL }}
          TWENTY_DB_URL: ${{ env.TWENTY_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          TWENTY_IMAGE_TAG: ${{ env.TWENTY_IMAGE_TAG }}
          TWENTY_PASSWORD: tim@apple.dev
        run: |
          set -euo pipefail
          npm run test:twenty -- --retries=0

      - name: Run Twenty E2E suite (nightly / matrix)
        if: >-
          ${{ steps.twenty_up.outcome == 'success'
          && (github.event_name == 'schedule' || inputs.run_browser_matrix) }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PW_WORKERS: "2"
          TWENTY_BASE_URL: ${{ env.TWENTY_E2E_BASE_URL }}
          TWENTY_DB_URL: ${{ env.TWENTY_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          TWENTY_IMAGE_TAG: ${{ env.TWENTY_IMAGE_TAG }}
          TWENTY_PASSWORD: tim@apple.dev
          P1_PW_REPORT_ID: twenty-chromium
        run: |
          set -euo pipefail
          npm run test:twenty -- --retries=0

      - name: Write Playwright job summary
        if: ${{ !cancelled() && steps.twenty_up.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.run_browser_matrix }}" = "true" ]; then
            npx tsx scripts/write-ci-job-summary.mts test-results/results-twenty-chromium.json twenty-chromium "${TWENTY_UP_SECONDS:-}"
          else
            npx tsx scripts/write-ci-job-summary.mts test-results/results.json
          fi

      - name: Merge blob reports into HTML
        if: ${{ !cancelled() && steps.twenty_up.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.run_browser_matrix }}" = "true" ]; then
            if [ -d blob-report-twenty-chromium ] && [ -n "$(find blob-report-twenty-chromium -type f -print -quit)" ]; then
              npx playwright merge-reports --reporter html ./blob-report-twenty-chromium
              rm -rf playwright-report-twenty
              mv playwright-report playwright-report-twenty
            else
              echo "No blob report to merge for twenty-chromium."
            fi
          else
            if [ -d blob-report ] && [ -n "$(find blob-report -type f -print -quit)" ]; then
              npx playwright merge-reports --reporter html ./blob-report
              rm -rf playwright-report-twenty
              mv playwright-report playwright-report-twenty
            else
              echo "No blob report to merge (tests may have failed before reporters ran)."
            fi
          fi

      - name: Count Twenty QA leaks
        if: ${{ always() && !cancelled() && steps.twenty_up.outcome == 'success' }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          TWENTY_BASE_URL: ${{ env.TWENTY_E2E_BASE_URL }}
          TWENTY_DB_URL: ${{ env.TWENTY_E2E_DB_URL }}
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          TWENTY_IMAGE_TAG: ${{ env.TWENTY_IMAGE_TAG }}
          P1_TWENTY_SWEEP_FAIL_ON_BEFORE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          set -euo pipefail
          npx tsx scripts/count-twenty-qa-leaks.mts

      - name: Capture Twenty compose logs
        if: failure() && steps.twenty_up.outcome == 'success'
        env:
          P1_DIR: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          compose_dir="${TWENTY_CHECKOUT_PATH}/packages/twenty-docker"
          docker compose -p qa-harness-twenty \
            -f "${compose_dir}/docker-compose.yml" \
            -f "${P1_DIR}/node_modules/qa-portfolio-harness/docker/twenty.compose.yml" \
            logs --no-color server worker db > twenty-compose-logs.txt || true
          sed -i -E \
            -e '/(ENCRYPTION_KEY|APP_SECRET|PASSWORD)=/Id' \
            twenty-compose-logs.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.twenty_up.outcome == 'success'
        with:
          name: twenty-compose-logs
          path: twenty-compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Twenty (harness down)
        if: always()
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
          TWENTY_BASE_URL: ${{ env.TWENTY_E2E_BASE_URL }}
          TWENTY_DB_URL: ${{ env.TWENTY_E2E_DB_URL }}
          TWENTY_IMAGE_TAG: ${{ env.TWENTY_IMAGE_TAG }}
        run: |
          set -euo pipefail
          node node_modules/qa-portfolio-harness/scripts/down.mjs twenty

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.twenty_up.outcome == 'success' }}
        with:
          name: playwright-report-twenty
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report-twenty
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.twenty_up.outcome == 'success' }}
        with:
          name: playwright-test-results-twenty-chromium
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Twenty docker image cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.twenty_images.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          docker save \
            "twentycrm/twenty:${TWENTY_IMAGE_TAG}" \
            postgres:16 \
            redis \
            axllent/mailpit:v1.22.3 \
            | gzip > "${TWENTY_IMAGES_TAR}"

      - name: Upload Twenty docker image cache
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.twenty_images.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TWENTY_IMAGES_TAR }}
          key: ${{ runner.os }}-twenty-images-v2.44.0
