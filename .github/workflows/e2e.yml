name: E2E

# Called from p1-e2e.yml. Job-level `if: secrets.*` is always empty in Actions,
# so live vs self-hosted is decided from an env check after the secret is injected.
on:
  workflow_call:
    inputs:
      cal_ref:
        description: Git ref for Jayami123/cal checkout
        type: string
        default: main
      self_hosted_timeout_minutes:
        description: Timeout for the cal-self-hosted job
        type: number
        default: 90
      playwright_browsers_timeout_minutes:
        description: >
          Timeout for Playwright Chromium install steps (cache + apt --with-deps).
          Hung apt mirrors (run 37792386085 attempt 1) must fail fast instead of
          consuming the 90-minute cal-self-hosted job.
        type: number
        default: 10
    secrets:
      CAL_E2E_BASE_URL:
        required: false
      CAL_E2E_EMAIL:
        required: false
      CAL_E2E_PASSWORD:
        required: false
      CAL_DST_EMAIL:
        required: false
      CAL_DST_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CAL_E2E_LOCAL_BASE_URL: http://127.0.0.1:3000
  CAL_DEFAULT_E2E_EMAIL: pro@example.com
  CAL_DEFAULT_DST_EMAIL: trial@example.com
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_INSTALLER_SHA: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_INSTALLER_SHA}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          version_out="$(./actionlint -version)"
          echo "$version_out"
          case "$version_out" in
            *1.7.12*) ;;
            *) echo "::error::Expected actionlint 1.7.12, got: ${version_out}"; exit 1 ;;
          esac
      - name: Lint workflows
        run: |
          set -euo pipefail
          ./actionlint
      - uses: ./.github/actions/setup-p1
      - name: npm audit
        run: |
          set -euo pipefail
          npm audit --audit-level=high
      - run: |
          set -euo pipefail
          npm run lint
      - run: |
          set -euo pipefail
          npm run format:check
      - run: |
          set -euo pipefail
          npm run test:unit

  structural:
    name: typecheck (always)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_live_url: ${{ steps.live.outputs.has_live_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - run: |
          set -euo pipefail
          npm run typecheck
      - id: live
        env:
          CAL_E2E_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "$CAL_E2E_BASE_URL" ]; then
            echo "has_live_url=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_live_url=false" >> "$GITHUB_OUTPUT"
          fi

  cal-chromium:
    name: cal-chromium shard ${{ matrix.shard }} (live Cal only, skipped without CAL_E2E_BASE_URL)
    needs: [lint, structural]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: needs.structural.outputs.has_live_url == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CAL_E2E_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
      CAL_BASE_URL: ${{ secrets.CAL_E2E_BASE_URL }}
      CAL_E2E_EMAIL: ${{ secrets.CAL_E2E_EMAIL }}
      CAL_E2E_PASSWORD: ${{ secrets.CAL_E2E_PASSWORD }}
      CAL_DST_EMAIL: ${{ secrets.CAL_DST_EMAIL }}
      CAL_DST_PASSWORD: ${{ secrets.CAL_DST_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - uses: ./.github/actions/playwright-browsers
        timeout-minutes: ${{ inputs.playwright_browsers_timeout_minutes }}
      - name: Run Cal Chromium shard
        run: |
          set -euo pipefail
          npx playwright test --project=cal-chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3

  merge-reports:
    name: merge Playwright HTML report (live Cal only, skipped without CAL_E2E_BASE_URL)
    needs: [structural, cal-chromium]
    if: ${{ !cancelled() && needs.structural.outputs.has_live_url == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-p1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge blob reports into HTML
        run: |
          set -euo pipefail
          mkdir -p test-results
          npx playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports
      - name: Write Playwright job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  cal-self-hosted:
    name: cal-self-hosted
    needs: [lint, structural]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.self_hosted_timeout_minutes }}
    if: needs.structural.outputs.has_live_url != 'true'
    env:
      P1_WORKING_DIRECTORY: p1
      CAL_CHECKOUT_PATH: products/cal
      PRODUCTS_ROOT: ${{ github.workspace }}/products
      # CodeQL actions/cache-poisoning/poisonable-step: workflow_dispatch can pass
      # untrusted cal_ref; do not restore or save caches that feed yarn / next build.
      CAL_SELF_HOSTED_USE_BUILD_CACHE: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Checkout Cal fork
        id: checkout_cal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jayami123/cal
          ref: ${{ inputs.cal_ref }}
          path: ${{ env.CAL_CHECKOUT_PATH }}
          persist-credentials: false

      - name: Stub harness product roots
        run: |
          set -euo pipefail
          # qa-portfolio-harness loadConfig() resolves every product under PRODUCTS_ROOT.
          mkdir -p "${PRODUCTS_ROOT}/documenso" "${PRODUCTS_ROOT}/medusa" "${PRODUCTS_ROOT}/twenty-CRM"

      - uses: ./p1/.github/actions/setup-p1
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Restore Cal Yarn cache
        if: ${{ env.CAL_SELF_HOSTED_USE_BUILD_CACHE == 'true' }}
        id: cal_yarn
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Restore Cal Next.js build cache
        if: ${{ env.CAL_SELF_HOSTED_USE_BUILD_CACHE == 'true' }}
        id: cal_next
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ steps.checkout_cal.outputs.commit }}

      - name: Install Cal dependencies
        working-directory: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable

      - name: Save Cal Yarn cache
        if: >-
          ${{ env.CAL_SELF_HOSTED_USE_BUILD_CACHE == 'true'
          && steps.cal_yarn.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/.yarn/cache
          key: cal-yarn-${{ hashFiles(format('{0}/yarn.lock', env.CAL_CHECKOUT_PATH)) }}

      - name: Prepare Cal product .env
        env:
          CAL_ENV_DIR: ${{ env.CAL_CHECKOUT_PATH }}
        run: |
          set -euo pipefail
          cp "${CAL_ENV_DIR}/.env.example" "${CAL_ENV_DIR}/.env"
          sed -i 's|http://localhost:3000|http://127.0.0.1:3000|g' "${CAL_ENV_DIR}/.env"
          NEXTAUTH_SECRET="$(openssl rand -base64 32)"
          CALENDSO_ENCRYPTION_KEY="$(openssl rand -base64 24)"
          echo "::add-mask::${NEXTAUTH_SECRET}"
          echo "::add-mask::${CALENDSO_ENCRYPTION_KEY}"
          grep -v '^NEXTAUTH_SECRET=' "${CAL_ENV_DIR}/.env" | grep -v '^CALENDSO_ENCRYPTION_KEY=' > "${CAL_ENV_DIR}/.env.tmp"
          mv "${CAL_ENV_DIR}/.env.tmp" "${CAL_ENV_DIR}/.env"
          printf 'NEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET" >> "${CAL_ENV_DIR}/.env"
          printf 'CALENDSO_ENCRYPTION_KEY=%s\n' "$CALENDSO_ENCRYPTION_KEY" >> "${CAL_ENV_DIR}/.env"
          if ! grep -qE '^NEXTAUTH_SECRET=.+' "${CAL_ENV_DIR}/.env"; then
            echo "::error::NEXTAUTH_SECRET is empty in ${CAL_ENV_DIR}/.env after prepare"
            exit 1
          fi
          if ! grep -qE '^CALENDSO_ENCRYPTION_KEY=.+' "${CAL_ENV_DIR}/.env"; then
            echo "::error::CALENDSO_ENCRYPTION_KEY is empty in ${CAL_ENV_DIR}/.env after prepare"
            exit 1
          fi

      - uses: ./p1/.github/actions/playwright-browsers
        timeout-minutes: ${{ inputs.playwright_browsers_timeout_minutes }}
        with:
          working-directory: ${{ env.P1_WORKING_DIRECTORY }}

      - name: Run Cal E2E suite
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        env:
          CAL_E2E_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_BASE_URL: ${{ env.CAL_E2E_LOCAL_BASE_URL }}
          CAL_E2E_EMAIL: ${{ env.CAL_DEFAULT_E2E_EMAIL }}
          CAL_E2E_PASSWORD: pro
          CAL_DST_EMAIL: ${{ env.CAL_DEFAULT_DST_EMAIL }}
          CAL_DST_PASSWORD: trial
          PRODUCTS_ROOT: ${{ env.PRODUCTS_ROOT }}
        run: |
          set -euo pipefail
          # Harness up() owns Postgres, seed, tRPC types, and next build.
          npm run test:cal

      - name: Write Playwright job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          npx tsx scripts/write-ci-job-summary.mts test-results/results.json

      - name: Merge blob reports into HTML
        if: ${{ !cancelled() }}
        working-directory: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          if [ -d blob-report ] && [ -n "$(find blob-report -type f -print -quit)" ]; then
            npx playwright merge-reports --reporter html ./blob-report
          else
            echo "No blob report to merge (tests may have failed before reporters ran)."
          fi

      - name: Redact Cal server log
        if: ${{ always() }}
        env:
          CAL_ENV_DIR: ${{ env.CAL_CHECKOUT_PATH }}
          P1_DIR: ${{ env.P1_WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          LOG_SRC="${P1_DIR}/node_modules/qa-portfolio-harness/.harness/cal-web.log"
          LOG_DST="cal-web-redacted.log"
          if [ ! -f "$LOG_SRC" ]; then
            echo "(no cal-web.log from harness)" > "$LOG_DST"
            exit 0
          fi
          sed -E \
            -e '/(SECRET|PASSWORD|KEY|TOKEN|API_KEY|ENCRYPTION)=/Id' \
            -e '/Bearer /Id' \
            "$LOG_SRC" > "$LOG_DST"
          read_env() {
            local key="$1"
            grep -E "^${key}=" "${CAL_ENV_DIR}/.env" | sed -E "s/^${key}=//" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
          }
          NEXTAUTH_VAL="$(read_env NEXTAUTH_SECRET)"
          ENCRYPTION_VAL="$(read_env CALENDSO_ENCRYPTION_KEY)"
          DB_URL="$(read_env DATABASE_URL)"
          DB_PASS=""
          if [[ "$DB_URL" =~ postgresql://[^:/@]+:([^@]*)@ ]]; then
            DB_PASS="${BASH_REMATCH[1]}"
          fi
          export NEXTAUTH_VAL ENCRYPTION_VAL DB_PASS
          perl -i -pe '
            my ($n, $e, $p) = ($ENV{NEXTAUTH_VAL}, $ENV{ENCRYPTION_VAL}, $ENV{DB_PASS});
            s/\Q$n\E/[REDACTED]/g if length $n;
            s/\Q$e\E/[REDACTED]/g if length $e;
            s/\Q$p\E/[REDACTED]/g if length $p;
          ' "$LOG_DST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ${{ env.P1_WORKING_DIRECTORY }}/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: ${{ env.P1_WORKING_DIRECTORY }}/test-results
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: cal-server-log
          path: cal-web-redacted.log
          retention-days: 14

      - name: Save Cal Next.js build cache
        if: >-
          ${{ env.CAL_SELF_HOSTED_USE_BUILD_CACHE == 'true'
          && steps.cal_next.outputs.cache-hit != 'true'
          && hashFiles(format('{0}/apps/web/.next/required-server-files.json', env.CAL_CHECKOUT_PATH)) != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CAL_CHECKOUT_PATH }}/apps/web/.next
          key: ${{ runner.os }}-cal-next-${{ steps.checkout_cal.outputs.commit }}
